name: build-deb

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: brew install ldid dpkg

      - name: Install theos
        run: git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS SDKs
        run: |
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"

      - name: Build tetherctl tool
        run: |
          mkdir -p layout/usr/bin
          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          xcrun clang -arch arm64 -isysroot "$SDK" \
            -target arm64-apple-ios15.0 -O2 \
            -framework Foundation \
            tool/tetherctl.m -o layout/usr/bin/tetherctl
          ldid -Stool/entitlements.plist layout/usr/bin/tetherctl
          ldid -e layout/usr/bin/tetherctl | head -20

      - name: Build rootless package
        run: make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: tetherunlock-deb
          path: packages/*.deb
